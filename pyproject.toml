[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "scratch",
    "dist",
    "node_modules",
    "frontend"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
    "F401",  # unused imports in existing code
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]

