groups:
  - name: sentinelops_alerts
    rules:
      - alert: PaymentHighErrorRate
        expr: sum(rate(http_requests_total{job="payment-service",status=~"5.."}[1m])) > 0
        for: 5s
        labels:
          severity: critical
          service: payment-service
        annotations:
          summary: "Payment Service HTTP 500 error spike detected"
          description: "Internal Server Errors detected on payment-service"

      - alert: ServiceUnreachable
        expr: up{job="payment-service"} == 0
        for: 10s
        labels:
          severity: high
          service: payment-service
        annotations:
          summary: "Payment Service instance unreachable"
          description: "Target failed to respond to Prometheus health probe"

      - alert: OrderHighErrorRate
        expr: sum(rate(http_requests_total{job="order-service",status=~"5.."}[1m])) > 0
        for: 5s
        labels:
          severity: critical
          service: order-service
        annotations:
          summary: "Order Service HTTP 500 error spike detected"
          description: "Internal Server Errors detected on order-service"

      - alert: OrderServiceUnreachable
        expr: up{job="order-service"} == 0
        for: 10s
        labels:
          severity: high
          service: order-service
        annotations:
          summary: "Order Service instance unreachable"
          description: "Target failed to respond to Prometheus health probe"

  - name: sentinelops_reliability_alerts
    rules:
      - alert: SentinelOpsBackendDown
        expr: up{job="backend"} == 0
        for: 15s
        labels:
          severity: critical
          service: sentinelops-backend
        annotations:
          summary: "SentinelOps AI Backend process is DOWN"
          description: "Core API and incident lifecycle engine failed to respond to scrape probes"

      - alert: SentinelOpsDatabaseDegraded
        expr: sentinelops_dependency_up{dependency="mongodb"} == 0
        for: 10s
        labels:
          severity: critical
          service: sentinelops-backend
        annotations:
          summary: "SentinelOps MongoDB connectivity degraded"
          description: "Database readiness probe failed or timed out"

      - alert: SentinelOpsRedisDegraded
        expr: sentinelops_dependency_up{dependency="redis"} == 0
        for: 10s
        labels:
          severity: high
          service: sentinelops-backend
        annotations:
          summary: "SentinelOps Redis connectivity degraded"
          description: "Distributed cache and deduplication coordinator failed probe"
