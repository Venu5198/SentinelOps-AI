global:
  resolve_timeout: 1m

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 1h
  receiver: "sentinelops-webhook"

receivers:
  - name: "sentinelops-webhook"
    webhook_configs:
      - url: "http://backend:8000/api/v1/alerts/webhook"
        send_resolved: true

