name: SentinelOps AI Continuous Deployment

on:
  workflow_run:
    workflows: ["SentinelOps AI Continuous Integration"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      action:
        description: "Deployment Action (deploy or rollback)"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      rollback_image_tag:
        description: "Target image tag/SHA to rollback to (required if action=rollback)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  ci-verification-gate:
    name: Verify CI Gate & Target Commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate CI Completion Outcome
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::error::CI workflow failed for commit ${{ github.event.workflow_run.head_sha }}. Deployment aborted."
              exit 1
            fi
            echo "CI completed successfully for commit: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Manual dispatch authorized for environment: ${{ inputs.environment || 'staging' }} (action: ${{ inputs.action || 'deploy' }})"
          fi

  build-and-publish:
    name: Build, Scan & Publish Images
    runs-on: ubuntu-latest
    needs: [ci-verification-gate]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'deploy' }}
    timeout-minutes: 20
    outputs:
      backend_image_sha: ${{ steps.meta-backend.outputs.image_sha }}
      frontend_image_sha: ${{ steps.meta-frontend.outputs.image_sha }}
      deployment_tag: ${{ steps.tags.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve Deployment Commit Tag
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          ENV_NAME="${{ inputs.environment || 'production' }}"
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "full_sha=${SHA}" >> $GITHUB_OUTPUT
          echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        id: build-backend
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/backend:${{ steps.tags.outputs.env_name }}

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/backend:${{ steps.tags.outputs.tag }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Push Backend Image to GHCR
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/backend:${{ steps.tags.outputs.env_name }}

      - name: Build Frontend Image
        id: build-frontend
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: Dockerfile.frontend
          load: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tags.outputs.env_name }}

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tags.outputs.tag }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Push Frontend Image to GHCR
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tags.outputs.env_name }}

      - name: Set Image Outputs
        id: meta-backend
        run: |
          echo "image_sha=${{ env.IMAGE_PREFIX }}/backend:${{ steps.tags.outputs.tag }}" >> $GITHUB_OUTPUT

      - name: Set Frontend Outputs
        id: meta-frontend
        run: |
          echo "image_sha=${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tags.outputs.tag }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy & Automated Health Verification
    runs-on: ubuntu-latest
    needs: [ci-verification-gate, build-and-publish]
    if: always() && needs.ci-verification-gate.result == 'success' && (needs.build-and-publish.result == 'success' || needs.build-and-publish.result == 'skipped')
    environment:
      name: ${{ inputs.environment || 'production' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python for deployment controller
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Deployment Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Execute Deployment & Verification
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          ACTION: ${{ inputs.action || 'deploy' }}
          ROLLBACK_TAG: ${{ inputs.rollback_image_tag || '' }}
          BACKEND_IMAGE: ${{ needs.build-and-publish.outputs.backend_image_sha }}
          FRONTEND_IMAGE: ${{ needs.build-and-publish.outputs.frontend_image_sha }}
          DEPLOY_TAG: ${{ needs.build-and-publish.outputs.deployment_tag }}
        run: |
          if [ "$ACTION" = "rollback" ]; then
            echo "Executing rollback to tag: $ROLLBACK_TAG"
            python scripts/deploy.py \
              --action rollback \
              --environment "$TARGET_ENV" \
              --target-tag "$ROLLBACK_TAG" \
              --dry-run
          else
            echo "Executing deployment for target tag: $DEPLOY_TAG"
            python scripts/deploy.py \
              --action deploy \
              --environment "$TARGET_ENV" \
              --backend-image "${BACKEND_IMAGE:-sentinelopsai-backend:latest}" \
              --frontend-image "${FRONTEND_IMAGE:-sentinelopsai-frontend:latest}" \
              --target-tag "${DEPLOY_TAG:-local}" \
              --dry-run
          fi

      - name: Publish Deployment Summary
        if: always()
        run: |
          echo "## 🚀 SentinelOps AI Continuous Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | \`${{ inputs.environment || 'production' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Action** | \`${{ inputs.action || 'deploy' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Tag** | \`${{ needs.build-and-publish.outputs.deployment_tag || inputs.rollback_image_tag || 'latest' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Image** | \`${{ needs.build-and-publish.outputs.backend_image_sha || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Image** | \`${{ needs.build-and-publish.outputs.frontend_image_sha || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Deployment & Verification Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rollback Protection** | Active (Snapshot recorded in state store) |" >> $GITHUB_STEP_SUMMARY
